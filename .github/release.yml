# Categorizes GitHub-generated comparison notes. Published releases are
# changelog-first and are created only by .github/workflows/release.yml.
changelog:
  categories:
    - title: Added
      labels: [feature, enhancement, added]
    - title: Fixed
      labels: [bug, fix, fixed]
    - title: Changed
      labels: [changed, refactor, docs]
    - title: Other
      labels: ["*"]
