name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Structural check, standard library only: marketplace.json is valid and
      # claims every skill in a promoted bucket; the router roster names every
      # pack skill; every router link resolves. See the script's docstring.
      - name: Check bucket, marketplace, and router freshness
        run: python3 scripts/check_router_freshness.py

      # The per-skill invocation classification (agent-invoked vs
      # user-invoked, and the slash command for the user path) is derived from
      # each SKILL.md's frontmatter; this fails the build when catalog.ts's
      # INVOCATION map or README.md's catalog-table Invocation column
      # disagrees. See the script's docstring.
      - name: Check invocation classification freshness
        run: python3 scripts/check_invocation_freshness.py

      # GitHub and strict-YAML harnesses reject frontmatter with an unquoted
      # ": " in a value (16 descriptions shipped that way; GitHub rendered an
      # error banner instead of the frontmatter table). This fails the build
      # when any tracked SKILL.md frontmatter falls outside the flat
      # strict-YAML-safe subset. Standard library only. See the docstring.
      - name: Check SKILL.md frontmatter is strict YAML
        run: python3 scripts/check_skill_frontmatter.py

      # The em dash is a reliable AI tell and skill prose style leaks into
      # model output (#226): this fails the build when any SKILL.md or
      # references file exceeds the per-file density threshold outside code.
      # Pure Python rather than grep, so it is grep-flavor-independent.
      # See the script's docstring.
      - name: Check em-dash density in skill texts
        run: python3 scripts/check_emdash_density.py

      # Decision 0005 retired several positioning lines from every public
      # surface; the review of that change found a skill still mandating one
      # verbatim with every other check green. This fails the build when a
      # retired phrase reappears in README, site source, skills, packs, or
      # manifests. See the script's docstring.
      - name: Check retired positioning lines stay retired
        run: python3 scripts/check_positioning.py

      # Tracker recipes must name the bound repo explicitly (#208): an
      # unqualified gh command resolves the repo implicitly, which in a fork
      # targets the upstream repo instead of the bound tracker.
      - name: Check tracker commands carry an explicit repo
        run: |
          set -euo pipefail
          # grep exit 1 is "no match" (fine); anything else (missing dir,
          # unreadable file) fails the step — no bare `|| true`.
          test -d skills
          grep -rnE --include='*.md' --exclude-dir=deprecated \
            '\bgh (issue|label|pr|search)\b' skills > /tmp/gh_lines || [ $? -eq 1 ]
          grep -v -- '--repo' /tmp/gh_lines > /tmp/bad || [ $? -eq 1 ]
          grep -rnE --include='*.md' --exclude-dir=deprecated \
            'repos/\{owner\}/\{repo\}' skills >> /tmp/bad || [ $? -eq 1 ]
          if [ -s /tmp/bad ]; then
            cat /tmp/bad
            echo 'Unqualified gh command or repos/{owner}/{repo} placeholder in skill docs — carry --repo <bound repo> / the literal repo in the api path (see tracker-discipline).' >&2
            exit 1
          fi

      # The site is written from a private context repository. This fails the
      # build if a confidential name or any email address reaches site/src.
      # The forbidden terms are stored as salted digests, so the check itself
      # discloses nothing. See the script's docstring.
      - name: Check the site discloses nothing it should not
        run: python3 scripts/check_site_disclosure.py

  codex-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check generated package and public contents
        run: |
          python3 scripts/build_codex_plugin.py --check
          python3 scripts/check_codex_publication.py
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests/codex')
          if not suite.countTestCases():
              raise SystemExit('No Codex publication tests discovered')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY

  site-link-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build

      # Tripwire for the per-skill link-preview cards (#214): og:url names the
      # page itself, the card images come from /skills/<slug>/, and the image
      # route serves a 1200x630 PNG. See the script's docstring.
      - name: Check per-skill link-preview cards
        working-directory: site
        run: |
          set -euo pipefail
          npm run start &
          python3 ../scripts/check_skill_og_cards.py

      # Tripwire for the Markdown twins (#216 close-out): /skills/<name>.md
      # serves each source SKILL.md body byte-identical; only the regenerated
      # frontmatter and the #213 install trailer may differ. Reuses the server
      # the previous step started. See the script's docstring.
      - name: Check markdown twins match their source SKILL.md
        working-directory: site
        run: python3 ../scripts/check_skill_md_twins.py

  advisory-board:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q skills/decide/advisory-board/scripts

      - name: Validate shell mocks
        run: |
          set -euo pipefail
          for script in skills/decide/advisory-board/tests/mocks/*; do
            [ -f "$script" ] || continue
            if head -n 1 "$script" | grep -qE '(ba|z|k)?sh'; then
              bash -n "$script"
            fi
          done

      - name: Run advisory-board tests
        run: python -m unittest discover -s skills/decide/advisory-board/tests -p 'test*.py'

      - name: Compile ingest sources
        run: python -m compileall -q skills/investigate/ingest/scripts

      - name: Run ingest tests
        run: python -m unittest discover -s skills/investigate/ingest/tests -t skills/investigate/ingest/tests -p 'test*.py'

      - name: Check tracked whitespace
        run: git diff --check HEAD^1 HEAD
