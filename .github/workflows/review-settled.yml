name: review-settled

# Reusable merge gate: a PR is "settled" only when CodeRabbit has reviewed
# the current head commit, no review thread is unresolved, and every thread
# CodeRabbit opened carries a reply from someone other than a bot. Closes the
# race where a PR merges minutes before the bot's incremental pass lands,
# stranding findings nobody dispositions (audit, 2026-08-19: live escapes on
# three repos), and the quieter escape where every thread is clicked resolved
# with no fix or reason on record (skills#288). Callers make this a required
# status check so the merge button waits for the review instead of racing it.

on:
  workflow_call:
    inputs:
      skip-title-regex:
        description: PR titles matching this regex are exempt (CodeRabbit is configured to skip them)
        type: string
        default: ''
      skip-label:
        description: PRs carrying this label are exempt (CodeRabbit is configured to skip them)
        type: string
        default: ''
      wait-minutes:
        description: minutes to wait for CodeRabbit to review the head commit before failing
        type: number
        default: 20

# contents: none — this workflow never checks out code or reads repo contents
# (REST reviews, issue labels/comments, and GraphQL reviewThreads only).
# Anything above "none" would
# force every caller to grant at least that much: a workflow_call fails when
# the caller's grant is narrower than what the called workflow requests
# (flagged by CodeRabbit on modeldeck-private#544).
permissions:
  contents: none
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # PR fields flow in via env, never inline ${{ }} in run: a PR title is
      # attacker-controlled on public repos (template-injection class).
      - name: Wait for CodeRabbit review of head, zero unresolved threads, a reply on every finding
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SKIP_TITLE_REGEX: ${{ inputs.skip-title-regex }}
          SKIP_LABEL: ${{ inputs.skip-label }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
        run: |
          set -euo pipefail
          owner=${REPO%/*}
          name=${REPO#*/}

          # Case-insensitive to mirror CodeRabbit's ignore_title_keywords
          # matching (keyword anywhere in the title, any case).
          if [ -n "$SKIP_TITLE_REGEX" ] && printf '%s' "$PR_TITLE" | grep -Eiq "$SKIP_TITLE_REGEX"; then
            echo "exempt: title matches skip regex ($SKIP_TITLE_REGEX)"
            exit 0
          fi
          if [ -n "$SKIP_LABEL" ] && gh api "repos/$REPO/issues/$PR_NUMBER/labels" --paginate --jq '.[].name' | grep -Fxq "$SKIP_LABEL"; then
            echo "exempt: PR carries the $SKIP_LABEL label"
            exit 0
          fi

          # Count review threads across every page; a partial count would
          # either deadlock resolved PRs or green-light unseen threads. Emits
          # two numbers: unresolved threads, and threads CodeRabbit opened
          # that carry no reply from a non-bot author (resolving a finding
          # without answering it is the escape this closes). GraphQL reports
          # the bot's login without the "[bot]" suffix REST uses; a deleted
          # replier has a null author and still counts as a human reply.
          count_threads() {
            local cursor='' page unresolved unreplied
            unresolved=0
            unreplied=0
            while :; do
              page=$(gh api graphql \
                -f query='query($owner: String!, $name: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          isResolved
                          comments(first: 100) { nodes { author { __typename login } } }
                        }
                      }
                    }
                  }
                }' -f owner="$owner" -f name="$name" -F number="$PR_NUMBER" \
                ${cursor:+-f cursor="$cursor"} \
                --jq '.data.repository.pullRequest.reviewThreads')
              unresolved=$((unresolved + $(jq '[.nodes[] | select(.isResolved | not)] | length' <<<"$page")))
              unreplied=$((unreplied + $(jq '[.nodes[]
                | select(.comments.nodes[0].author.login == "coderabbitai")
                | select([.comments.nodes[1:][] | select((.author.__typename // "User") != "Bot")] | length == 0)
                ] | length' <<<"$page")))
              [ "$(jq -r '.pageInfo.hasNextPage' <<<"$page")" = "true" ] || break
              cursor=$(jq -r '.pageInfo.endCursor' <<<"$page")
            done
            echo "$unresolved $unreplied"
          }

          deadline=$((SECONDS + WAIT_MINUTES * 60))
          while :; do
            # A review object whose commit_id is the current head means the
            # bot has seen this exact code, fix pushes included. --paginate
            # emits one JSON array per page, so aggregate with jq -s.
            reviewed=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate | jq -s \
              --arg head "$HEAD_SHA" \
              '[.[][] | select(.user.login == "coderabbitai[bot]" and .commit_id == $head)] | length')

            # A zero-finding pass posts NO review object (proven live:
            # timharris707/chili#307 sat red for 20 minutes after a clean
            # review). The walkthrough comment is updated every pass and its
            # Commits section names the reviewed range, so the head SHA as
            # the range's endpoint ("between <sha> and <head>") is the same
            # evidence. Anchored to that phrase, not the whole body: the SHA
            # appearing elsewhere in a bot comment proves nothing. A
            # rate-limit notice carries the same summarize marker and range
            # but reviews nothing (skills#291 passed the gate unread), so it
            # is excluded by its own marker; "in progress" likewise.
            if [ "$reviewed" -eq 0 ]; then
              reviewed=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate | jq -s \
                --arg head "$HEAD_SHA" \
                '[.[][] | select(.user.login == "coderabbitai[bot]"
                                 and (.body | contains("auto-generated comment: summarize"))
                                 and (.body | contains("rate limited by coderabbit") | not)
                                 and (.body | contains("review in progress by coderabbit") | not)
                                 and (.body | test("between [0-9a-f]{40} and " + $head)))] | length')
            fi

            # Assign first so a failed count aborts under set -e; a bare
            # read <<<"$(...)" discards the substitution's status and would
            # spin the whole wait window on a transient API error.
            counts=$(count_threads)
            read -r unresolved unreplied <<<"$counts"

            echo "head-reviewed=$reviewed unresolved-threads=$unresolved unreplied-findings=$unreplied"
            if [ "$reviewed" -gt 0 ] && [ "$unresolved" -eq 0 ] && [ "$unreplied" -eq 0 ]; then
              echo "settled: CodeRabbit has seen $HEAD_SHA, every review thread is resolved, and every finding has a reply"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "not settled after $WAIT_MINUTES minutes."
              echo "needs: a CodeRabbit review of head $HEAD_SHA, zero unresolved threads, and a non-bot reply on every thread CodeRabbit opened (fixed, or declined with a reason)."
              echo "if CodeRabbit is configured to skip this PR, exempt it explicitly via the skip label or title regex."
              echo "after dispositioning findings and resolving threads, re-run this check (gh run rerun <run-id>)."
              exit 1
            fi
            sleep 30
          done
